<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Streaming text parser: walkthrough</title>
<link rel="stylesheet" href="../lib/lecture.css">
<link rel="stylesheet" href="../lib/walk.css">
<script src="../lib/icons.js"></script>
<script src="../lib/lecture.js"></script>
<script src="../lib/walk.js"></script>
<script src="data.js"></script>
<style>
:root { --c-text:#5f6368; --c-inline:#2456c7; --c-fence:#8250df; }
.quote { font-size:50px; line-height:1.36; font-weight:600; background:#fff; border-left:12px solid var(--acc); border-radius:14px; padding:30px 40px; }
.iorow { display:grid; grid-template-columns:400px 560px 80px 620px; align-items:center; font-size:38px; background:#fff; border:3px solid var(--line); border-radius:18px; padding:18px 30px; }
.iorow code { font: 700 36px Consolas, Menlo, monospace; color:var(--acc); }
.iorow .arr { font-size:50px; color:var(--muted); font-weight:800; text-align:center; }
.bigline { font-size:50px; font-weight:800; line-height:1.3; }
.qrow { display:grid; grid-template-columns:680px 1000px; gap:24px; align-items:center; background:#fff; border:3px solid var(--line); border-radius:18px; padding:18px 30px; font-size:36px; line-height:1.3; }
.qrow b { color:var(--acc); }
.mdc { background:#fff; border:3px solid var(--line); border-radius:20px; padding:22px 34px; }
.mdc h3 { font: 800 34px "Segoe UI"; margin:0 0 14px; color:var(--muted); }
.raw { font: 700 44px/1.5 Consolas, Menlo, monospace; white-space:pre; }
.raw span { padding:0 4px; border-radius:7px; transition: background .4s, color .4s; }
.raw .bi.lit { background:#dbe6ff; color:var(--c-inline); }
.raw .bf.lit { background:#eee2ff; color:var(--c-fence); }
.rend { font-size:44px; line-height:1.5; }
.rin { font: 700 42px Consolas, Menlo, monospace; padding:2px 16px; border-radius:9px; background:#eef0f3; transition: all .4s; }
.rin.lit { background:var(--c-inline); color:#fff; }
.rfence { font: 700 42px Consolas, Menlo, monospace; background:#eef0f3; border-radius:12px; padding:14px 22px; margin:10px 0; transition: all .4s; }
.rfence small { display:block; font: 700 26px "Segoe UI"; color:var(--muted); }
.rfence.lit { background:var(--c-fence); color:#fff; } .rfence.lit small { color:#e6dcff; }
.tiles { display:flex; gap:2px; }
.t { width:38px; height:60px; display:flex; align-items:center; justify-content:center; font: 700 32px Consolas, Menlo, monospace; border-radius:7px; background:#fff; border:2px solid #dfe3ea; box-sizing:border-box; transition: background .15s, color .15s, transform .15s; }
.t.tick { color:#8a5a00; background:#ffe9a8; font-size:44px; border-color:#e8c766; }
.belt { position:absolute; display:flex; gap:12px; }
.chunk { display:flex; gap:2px; padding:6px; border-radius:12px; background:#e8eefb; border:3px solid #b9c9ee; transition: opacity .5s, transform .5s, background .3s; }
.chunk.wait { opacity:0; transform: translateY(-40px); }
.chunk.bad { background:#fdecee; border-color:var(--bad); }
.pill { border:none; display:inline-block; padding:6px 14px; margin:4px 4px 4px 0; border-radius:10px; font: 700 34px Consolas, Menlo, monospace; white-space:pre; color:#fff; }
.pill.text { background:#eef0f3; color:#30343a; } .pill.inline { background:var(--c-inline); } .pill.fence { background:var(--c-fence); }
.screen { background:#fff; border:3px solid var(--line); border-radius:18px; padding:14px 22px; min-height:84px; }
.screen i { font: 800 28px "Segoe UI"; color:var(--muted); font-style:normal; display:block; margin-bottom:6px; }
.evrow { display:grid; grid-template-columns:340px 70px 1290px; align-items:center; background:#fff; border:3px solid var(--line); border-radius:14px; padding:8px 24px; font: 700 30px Consolas, Menlo, monospace; min-height:64px; }
.evrow .arr { color:var(--muted); font-size:40px; text-align:center; }
.evrow .r { opacity:0; transition: opacity .4s; } .evrow .r.in { opacity:1; }
.ev { display:inline-block; padding:2px 10px; margin:2px 6px 2px 0; border-radius:8px; white-space:pre; }
.ev.text { background:#eef0f3; color:#30343a; } .ev.inline { background:#dbe6ff; color:var(--c-inline); } .ev.fence { background:#eee2ff; color:var(--c-fence); }
.sel { background:#b4d5fe; }
.way { background:#fff; border:3px solid var(--line); border-radius:20px; padding:24px 30px; height:560px; box-sizing:border-box; }
.way h3 { font-size:42px; margin:0 0 18px; }
.way .scr { height:300px; border:3px solid var(--line); border-radius:12px; padding:14px; font: 700 28px/1.4 Consolas, Menlo, monospace; overflow:hidden; background:#fafaf7; transition: opacity .1s; }
.way .v { margin-top:20px; font-size:36px; font-weight:800; color:var(--bad); }
.tileRow { position:absolute; transform: scale(1.7); transform-origin: left top; }
.bigv { position:absolute; font-size:44px; font-weight:800; }
.q { position:absolute; font: 800 90px "Segoe UI"; color:var(--warn); }
.st-box { position:absolute; width:300px; height:130px; display:flex; align-items:center; justify-content:center; border-radius:24px; font-size:46px; font-weight:800; background:#fff; border:4px solid #c9ced6; color:#7a808a; transition: all .25s; }
.st-box.on { color:#fff; transform: scale(1.06); box-shadow:0 10px 26px rgba(0,0,0,.18); }
.st-box.text.on { background:var(--c-text); border-color:var(--c-text); }
.st-box.inline.on { background:var(--c-inline); border-color:var(--c-inline); }
.st-box.fence.on { background:var(--c-fence); border-color:var(--c-fence); }
.slot { width:62px; height:78px; border:4px dashed #d9c17a; border-radius:12px; display:flex; align-items:center; justify-content:center; font: 800 48px Consolas, Menlo, monospace; color:var(--warn); background:#fff; transition: all .15s; box-sizing:border-box; }
.slot.full { background:#fff5d6; border-style:solid; border-color:var(--warn); transform: scale(1.06); }
.slots { display:flex; gap:12px; }
.lightbox { background:#30343a; border-radius:30px; padding:26px; display:flex; flex-direction:column; gap:22px; width:150px; }
.lightbox i { display:block; width:150px; height:150px; border-radius:50%; background:#555a62; transition: background .2s, box-shadow .2s; }
.lightbox i.r.on { background:#e5484d; box-shadow:0 0 40px #e5484d; } .lightbox i.a.on { background:#f5b301; box-shadow:0 0 40px #f5b301; } .lightbox i.g.on { background:#30a46c; box-shadow:0 0 40px #30a46c; }
.bigstate { font: 700 64px Consolas, Menlo, monospace; }
/* the machine: the parser's memory, painted from the real trace */
.mach { height:980px; }
.mach > div { position:absolute; }
.ml { font: 700 27px Consolas, Menlo, monospace; color:var(--muted); }
.ml small { font: 600 25px "Segoe UI"; margin-left:8px; }
.m-t { gap:3px; }
.m-t .t { width:62px; height:68px; font-size:38px; }
.m-t .t.tick { font-size:50px; }
.m-t .t.cur { transform: translateY(-8px); outline:5px solid #d97706; }
.m-t .t.done { background:#eef0f3; color:#a4a9b1; border-color:#eef0f3; }
.m-s { display:flex; gap:20px; }
.m-s .sb { width:280px; height:78px; display:flex; align-items:center; justify-content:center; border-radius:16px; font-size:38px; font-weight:800; background:#fff; border:4px solid #c9ced6; color:#7a808a; transition: all .2s; }
.m-s .sb.on { color:#fff; }
.m-s .sb.text.on { background:var(--c-text); border-color:var(--c-text); } .m-s .sb.inline.on { background:var(--c-inline); border-color:var(--c-inline); } .m-s .sb.fence.on { background:var(--c-fence); border-color:var(--c-fence); }
.m-h .slot { width:58px; height:68px; font-size:44px; }
.m-b { display:flex; gap:3px; min-height:68px; min-width:60px; padding:0 8px; background:#fff; border:3px solid var(--line); border-radius:12px; align-items:center; box-sizing:border-box; }
.m-b .t { width:42px; height:54px; font-size:30px; } .m-b .t.tick { font-size:38px; }
.m-o { width:900px; min-height:100px; box-sizing:border-box; background:#fff; border:3px solid var(--line); border-radius:12px; padding:8px 14px; font: 700 27px/1.5 Consolas, Menlo, monospace; }
.m-sc { width:900px; min-height:190px; box-sizing:border-box; background:#fff; border:3px solid var(--acc); border-radius:12px; padding:10px 14px; }
.m-sc .pill { font-size:30px; padding:4px 10px; }
.mach.vars .m-t, .mach.vars .m-o, .mach.vars .m-sc, .mach.vars .fadeL { opacity:.22; }
/* tests */
.mini { position:absolute; display:flex; gap:8px; flex-wrap:nowrap; }
.mini .chunk { padding:3px; }
.mini .t { width:21px; height:36px; font-size:19px; border-width:1px; } .mini .t.tick { font-size:24px; }
.nasty { display:flex; flex-wrap:wrap; gap:10px; font: 700 30px Consolas, Menlo, monospace; }
.nasty span { padding:6px 14px; background:#fff5d6; border:2px solid #e8c766; border-radius:10px; opacity:0; transition: opacity .3s; white-space:pre; }
.nasty span.in { opacity:1; }
.panel2 { background:#fff; border:3px solid var(--line); border-radius:16px; padding:14px 20px; font: 28px/1.4 Consolas, Menlo, monospace; }
.panel2 h4 { font: 800 28px "Segoe UI"; margin:0 0 8px; color:var(--muted); }
.tlbar { display:flex; gap:6px; }
.tlbar div { opacity:0; transition: opacity .4s; height:190px; border-radius:14px; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:27px; font-weight:800; padding:4px; line-height:1.2; }
.tlbar div.in { opacity:1; } .tlbar small { font-size:25px; font-weight:600; margin-top:6px; }
.fucard { background:#fff; border:3px solid var(--line); border-radius:20px; padding:20px 30px; height:400px; box-sizing:border-box; }
.fucard h3 { font-size:40px; margin:0 0 14px; }
.fucard .why { font-size:31px; line-height:1.3; margin-top:16px; }
.frow { display:flex; align-items:center; gap:14px; margin:10px 0; font-size:32px; font-weight:700; }
.chp { padding:10px 18px; border-radius:12px; color:#fff; font-size:30px; font-weight:800; background:var(--c-text); }
.chp.in2 { background:#bf8700; } .chp.fen { background:var(--c-fence); }
.rrow { display:grid; grid-template-columns:790px 80px 840px; align-items:center; background:#fff; border:3px solid var(--line); border-radius:18px; padding:24px 30px; font-size:38px; font-weight:700; }
.rrow code { font: 700 32px Consolas, Menlo, monospace; color:#8a4b00; background:#fff1cc; padding:6px 12px; border-radius:8px; }
.rrow .arr { font-size:50px; color:#d97706; text-align:center; font-weight:800; }
.fullc { position:absolute; top:54px; background:#fff; border:3px solid var(--line); border-radius:14px; padding:10px 0; font: 23px/1.32 Consolas, Menlo, monospace; width:940px; }
.fullc .ln { padding:0 14px; white-space:pre; border-left:7px solid transparent; transition: background .3s, opacity .3s; }
.fullc .ln.lit { background:#fff1cc; border-left-color:#d97706; }
.fullc.focus .ln:not(.lit) { opacity:.38; }
.cost { display:grid; grid-template-columns:600px 1040px; align-items:center; background:#fff; border:3px solid var(--line); border-radius:18px; padding:30px 30px; font-size:40px; }
.cost b { color:var(--good); }
</style>
</head>
<body>
<script>
const CH = Chapters(['What is it?', 'Problem', 'Why', 'Plan', 'State', 'feed', 'Backticks', 'Tests', 'Follow-ups', 'Full code']);
const go = (o, c) => { clearLinks(); o.show(); CH.set(c); };
const TK_ = '`';
const vis = c => c === '\n' ? '↵' : c === ' ' ? '&nbsp;' : esc(c);
const visS = s => esc(s).replace(/\n/g, '↵');
const tilesHtml = s => [...s].map(c => `<span class="t ${c === TK_ ? 'tick' : ''}">${vis(c)}</span>`).join('');
const pills = list => list.map(([k, t]) => `<span class="pill ${k}">${visS(t)}</span>`).join('');
const evs = list => list.length ? list.map(([k, t]) => `<span class="ev ${k}">("${k}", "${visS(t)}")</span>`).join('') : '[ ]';
const idx = (c, i) => TR.findIndex(s => s.n === c && s.i === i);

Title({ num: 2, name: 'Streaming text parser', sub: 'From the problem, to the picture, to every line of code', phase: '' });
const TF = titleFigure('Coding walkthrough 2 of 3', 960);
TF.node('p', 380, 540, 'gear', 'Parser', '', { w: 190 });
['a', 'b', 'c'].forEach((k, i) => TF.node(k, 90, 280 + i * 260, 'doc', 'chunk', '', { w: 130 }));
[['t', 680, 280], ['i', 680, 540], ['f', 680, 800]].forEach(([k, x, y]) => TF.node(k, x, y, null, { t: 'text', i: 'inline', f: 'fence' }[k], '', { w: 130, h: 76 }));
const tfLoop = setInterval(async () => {
  const a = ['a', 'b', 'c'][Math.floor(Math.random() * 3)], o = [['t', 'muted'], ['i', 'acc'], ['f', '#8250df']][Math.floor(Math.random() * 3)];
  await TF.send(a, 'p', { dur: 520, r: 12, color: 'warn' }); await TF.send('p', o[0], { dur: 520, r: 12, color: o[1] });
}, 620);

// ==================================================================== 0. the words
const MD = Stage('md', { caption: ['Markdown', 'Plain text, with small marks for styling'] });
block(MD, 'mdc', 110, 250, '<h3>What the model sends</h3><div class="raw">Use <span class="bi">`</span>x<span class="bi">`</span> then <span class="bf">```</span>py\nprint(1)\n<span class="bf">```</span> done</div>', 820);
block(MD, 'mdc', 990, 250, '<h3>What the reader should see</h3><div class="rend">Use <span class="rin">x</span> then<div class="rfence"><small>py</small>print(1)</div>done</div>', 820);
const mdQ = s => MD.svg.parentNode.querySelectorAll(s);
const row1 = block(MD, 'bigline fade', 110, 690, '<span class="t tick" style="display:inline-flex;width:70px;height:90px;font-size:70px;vertical-align:middle">`</span> &nbsp;One on each side: <span style="color:var(--c-inline)">inline code</span>', 1700);
const row2 = block(MD, 'bigline fade', 110, 840, '<span class="t tick" style="display:inline-flex;width:70px;height:90px;font-size:70px;vertical-align:middle">`</span><span class="t tick" style="display:inline-flex;width:70px;height:90px;font-size:70px;vertical-align:middle">`</span><span class="t tick" style="display:inline-flex;width:70px;height:90px;font-size:70px;vertical-align:middle">`</span> &nbsp;Three in a row: a <span style="color:var(--c-fence)">code block</span>, or <span style="color:var(--c-fence)">code fence</span>', 1700);
window.D1 = () => { clearInterval(tfLoop); go(MD, 0); };
window.D2 = async () => { MD.cap('The backtick', ''); row1.classList.add('in'); await sleep(2800); mdQ('.bi').forEach(e => e.classList.add('lit')); mdQ('.rin').forEach(e => e.classList.add('lit')); };
window.D3 = async () => { row2.classList.add('in'); await sleep(900); mdQ('.bf').forEach(e => e.classList.add('lit')); mdQ('.rfence').forEach(e => e.classList.add('lit')); };

const PA = Stage('pars', { caption: ['A parser', 'Reads raw text, and works out what each part means'] });
PA.node('raw', 300, 560, 'doc', 'raw text', '', { w: 260 }); PA.node('p', 860, 560, 'gear', 'Parser', '', { w: 240 }); PA.link('raw', 'p');
const paO = [['text', 'Use '], ['inline', 'x'], ['fence', 'print(1)']].map(([k, t], i) => block(PA, 'bigline fade', 1200, 330 + i * 170, `<span class="pill ${k}" style="font-size:42px">${t}</span> <span style="font-size:36px;color:var(--muted)">${k === 'text' ? 'plain text' : k === 'inline' ? 'inline code' : 'code fence'}</span>`, 680));
window.D4 = async () => { go(PA, 0); await sleep(1500); for (const e of paO) { await PA.send('raw', 'p', { dur: 800, r: 13 }); await sleep(100); e.classList.add('in'); await sleep(500); } };

const AR = Stage('arrive', { caption: ['Streaming', 'The reply arrives in small pieces, called chunks'] });
const beltA = block(AR, 'belt', 110, 300, CHUNKS.map(c => `<div class="chunk wait">${tilesHtml(c)}</div>`).join(''));
const arLab = block(AR, 'bigline fade', 480, 440, '<span style="color:var(--bad)">↑ a cut through the middle of three backticks</span>', 1300);
const arScr = block(AR, 'screen fade', 110, 620, '<i>On screen</i><div id="arS"></div>', 1700);
window.D5 = async () => { go(AR, 0); await sleep(2500); for (const c of beltA.children) { c.classList.remove('wait'); await sleep(900); } };
window.D6 = async () => { AR.cap('The cuts land anywhere', 'You don\'t choose them'); await sleep(1600); [1, 2].forEach(i => beltA.children[i].classList.add('bad')); arLab.classList.add('in'); };
window.D7 = async () => {
  AR.cap('A streaming parser', 'Handles each chunk as it arrives');
  [1, 2].forEach(i => beltA.children[i].classList.remove('bad')); arLab.classList.remove('in'); arScr.classList.add('in'); await sleep(1500);
  const sh = []; for (let i = 0; i < CHUNKS.length; i++) { [...beltA.children].forEach((c, j) => c.style.opacity = j === i ? 1 : j < i ? .4 : 1); sh.push(...EVENTS[i]); document.getElementById('arS').innerHTML = pills(sh.reduce((m, [k, t]) => { if (m.length && m[m.length - 1][0] === k) m[m.length - 1] = [k, m[m.length - 1][1] + t]; else m.push([k, t]); return m; }, [])); await sleep(1050); }
  [...beltA.children].forEach(c => c.style.opacity = 1);
};

// ==================================================================== 1. the problem
const PR = Stage('prompt', { caption: ['', ''] });
block(PR, 'quote', 110, 80, 'Text from a model arrives in <b>chunks</b>. As each chunk arrives, work out what can be shown, and how it\'s styled.', 1700);
const rows = [['feed(chunk)', 'one chunk of text', 'a list of events'], ['finish()', 'nothing: the stream ended', 'anything still waiting']]
  .map(([c, i, o], n) => block(PR, 'iorow fade', 110, 390 + n * 180, `<code>${c}</code><span>${i}</span><span class="arr">→</span><b>${o}</b>`, 1700));
const evRow = block(PR, 'bigline fade', 110, 790, 'An event is a pair: <span class="ev text">("text", "Use ")</span> <span class="ev inline">("inline", "x")</span> <span class="ev fence">("fence", "print(1)")</span>', 1700);
window.P1 = () => go(PR, 1);
window.P2 = async () => { rows[0].classList.add('in'); await sleep(2600); evRow.classList.add('in'); };
window.P3 = () => rows[1].classList.add('in');

const EX = Stage('example', { caption: ['', ''] });
const evR = CHUNKS.map((c, i) => block(EX, 'evrow fade', 110, 70 + i * 94, `<span>feed("${visS(c).replace(/&nbsp;/g, ' ')}")</span><span class="arr">→</span><span class="r">${evs(EVENTS[i])}</span>`, 1700));
evR.forEach(r => { r.style.gridTemplateColumns = '440px 70px 1190px'; });
const exS = block(EX, 'screen fade', 110, 660, '<i>On screen</i>' + pills(FINAL), 1700);
window.E1 = async () => { go(EX, 1); for (const r of evR) { await sleep(450); r.classList.add('in'); } };
window.E2 = async () => { await sleep(1500); for (const r of evR) { r.querySelector('.r').classList.add('in'); await sleep(1100); } };
window.E3 = () => exS.classList.add('in');

const RL = Stage('rule', { caption: ['Rule 1: the cuts can\'t matter', 'Same text, cut three ways'] });
const cuts3 = [[SAMPLE], ['Use `x', '` then ``', '`py\nprint(1)\n``', '` done'], ['Us', 'e `x` then `', '``p', 'y\nprint(1)\n`', '`', '` done']];
const beltR = cuts3.map((row, i) => { const b = block(RL, 'mini fade', 110, 260 + i * 110, row.map(c => `<div class="chunk">${tilesHtml(c)}</div>`).join('')); b.style.transform = 'scale(1.75)'; b.style.transformOrigin = 'left top'; return b; });
const rlO = block(RL, 'screen fade', 110, 640, '<i>Every time</i>' + pills(FINAL), 1700);
window.P4 = async () => { go(RL, 1); await sleep(3200); for (const b of beltR) { b.classList.add('in'); await sleep(1100); } await sleep(300); rlO.classList.add('in'); };

const OP = Stage('optim', { caption: ['Rule 2: style it as soon as you can', 'Before the closing backtick arrives'] });
const opS = block(OP, 'screen', 110, 300, '<i>On screen</i><span class="pill text" id="op0">Try </span><span class="pill inline" id="op1" style="display:none"></span><span class="pill text" id="op2" style="display:none"></span>', 1700);
const opN = block(OP, 'bigline fade', 110, 520, 'The closing backtick hasn\'t arrived. <span style="color:var(--c-inline)">Show it as code anyway.</span>', 1700);
const opN2 = block(OP, 'bigline fade', 110, 660, '<span class="sel">&nbsp;Selected text&nbsp;</span> stays selected, because the screen only <span style="color:var(--good)">grows at the end</span>.', 1700);
const CODE_TXT = 'print("hello world")';
let opStop = false;
window.P5 = async () => {
  go(OP, 1); await sleep(3400); const a = document.getElementById('op1'); a.style.display = 'inline-block';
  for (const c of 'print("hello wor') { a.textContent += c; await sleep(170); }
  opN.classList.add('in');
};
window.P6 = async () => {
  OP.cap('Rule 3: never take back what\'s on screen', 'Events only add to the end');
  const a = document.getElementById('op1'), o = document.getElementById('op0'); await sleep(1500); o.classList.add('sel'); o.style.background = '#b4d5fe';
  for (const c of 'ld")') { a.textContent += c; await sleep(280); }
  const b = document.getElementById('op2'); b.style.display = 'inline-block'; opN2.classList.add('in');
  for (const c of ' to print a greeting') { b.textContent += c; await sleep(180); }
};

// ==================================================================== 2. why it's hard
const WY = Stage('ways', { caption: ['Why not the obvious way?', ''] });
const w1 = block(WY, 'way fade', 110, 230, '<h3>Wait for the end</h3><div class="scr" id="w1s"></div><div class="v">A blank screen until the end</div>', 820);
const w2 = block(WY, 'way fade', 990, 230, '<h3>Re-parse and redraw it all</h3><div class="scr" id="w2s"></div><div class="v">Flicker, lost selection, growing work</div>', 820);
window.B1 = async () => { go(WY, 2); await sleep(2000); w1.classList.add('in'); };

const hrN = block(HR, 'bigline fade', 110, 640, 'Run a test after each step, so a bug can only be in what you just wrote.', 1700);
window.Q3 = async () => { go(HR, 7); for (const c of tl.children) { await sleep(1900); c.classList.add('in'); } hrN.classList.add('in'); };

// ==================================================================== 8. follow-ups
const FU = Stage('fu', { caption: ['Expect follow-ups', ''] });
const fus = [
  ['Pull out the language name', '<div class="frow"><span class="chp">TEXT</span>→<span class="chp in2">FENCE_INFO</span>→<span class="chp fen">FENCE</span></div><div class="frow"><span class="tiles">' + tilesHtml('```py\n') + '</span></div>', 'A fourth state, up to the newline.'],
  ['Fence only at line start', '<div class="frow"><span class="tiles">' + tilesHtml('\n```') + '</span><span style="color:var(--good)">a fence</span></div><div class="frow"><span class="tiles">' + tilesHtml('x```') + '</span><span style="color:var(--muted)">ordinary characters</span></div>', 'Remember if the last character was a newline.'],
  ['Other marks, like bold', '<div class="frow"><span class="tiles">' + tilesHtml('*a') + '</span><span>one star: italics</span></div><div class="frow"><span class="tiles">' + tilesHtml('**') + '</span><span>two stars: bold</span></div>', 'The same trick: hold it until you can tell.'],
  ['On the screen', '<div class="frow"><span class="pill text">Use </span><span class="pill inline">x</span><span class="pill text"> th</span><span class="pill text" style="background:#e6f4ea;color:var(--good)">en</span> ← new</div>', 'Add to the last block, or open a new one. Old text is never touched.'],
].map(([t, pic, w], i) => block(FU, 'fucard fade', 110 + (i % 2) * 870, 210 + Math.floor(i / 2) * 420, `<h3>${t}</h3>${pic}<div class="why">${w}</div>`, 830));
window.U1 = () => { go(FU, 8); fus[0].classList.add('in'); };
window.U2 = () => fus[1].classList.add('in');
window.U3 = () => fus[2].classList.add('in');
window.U4 = () => fus[3].classList.add('in');

// ==================================================================== 9. the full solution
const FC = document.createElement('section'); FC.id = 'fullcode'; FC.className = 'scene'; document.body.append(FC);
const makeCol = (lines, x) => { const b = document.createElement('div'); b.className = 'fullc'; b.style.left = x + 'px'; FC.append(b);
  return { b, lines, L: lines.map(t => { const e = document.createElement('div'); e.className = 'ln'; e.innerHTML = py(t) || ' '; b.append(e); return e; }) }; };
const COLS = [makeCol(FULL.left, 12), makeCol(FULL.right, 966)];
function lit(starts) {
  COLS.forEach(c => { c.L.forEach(l => l.classList.remove('lit')); c.b.classList.add('focus'); });
  for (const st of starts) for (const c of COLS) {
    const i = c.lines.findIndex(l => l.startsWith(st)); if (i < 0) continue;
    const ind = st.length - st.trimStart().length; c.L[i].classList.add('lit');
    for (let j = i + 1; j < c.lines.length; j++) { const t = c.lines[j]; if (t.trim() && t.length - t.trimStart().length <= ind) break; if (t.trim()) c.L[j].classList.add('lit'); }
  }
}
window.S1 = () => { clearLinks(); show('fullcode'); CH.set(9); COLS.forEach(c => c.b.classList.remove('focus')); };
window.S2 = () => lit(['    def __init__']);
window.S3 = () => lit(['    def feed']);
window.S4 = () => lit(['    def _tick']);
window.S5 = () => lit(['    def _settle']);
window.S6 = () => lit(['    def _switch', '    def _flush']);
window.S7 = () => lit(['    def finish']);

const CS = Stage('costs', { caption: ['What it costs', ''] });
const csr = [['Time', 'One step per character: <b>O(n)</b>'], ['Held between chunks', 'The state, and <b>at most 2 backticks</b>']].map(([a, b], i) => block(CS, 'cost fade', 110, 340 + i * 220, `<span style="font-weight:800">${a}</span><span>${b}</span>`, 1700));
window.S8 = async () => { go(CS, 9); await sleep(800); csr[0].classList.add('in'); await sleep(2200); csr[1].classList.add('in'); };

const RC = Stage('recap', { caption: ['', ''] });
const rr = [['The lit box', 'self.state'], ['The filled slots', 'self.ticks'], ['Tiles waiting to go out', 'self.buf'], ['Tiles leaving as one piece', 'self._flush(out)'], ['A box lighting up', 'self._switch(state, out)']]
  .map(([a, b], i) => block(RC, 'rrow fade', 110, 110 + i * 180, `<span>${a}</span><span class="arr">→</span><span><code>${esc(b)}</code></span>`, 1710));
window.R1 = async () => { go(RC, 9); await sleep(2200); rr[0].classList.add('in'); await sleep(1600); rr[1].classList.add('in'); };
window.R2 = async () => { rr[2].classList.add('in'); await sleep(2200); rr[3].classList.add('in'); };
window.R3 = () => rr[4].classList.add('in');

const Z = Say('say', 'Only two things cross a chunk: the state, and the held backticks.');
document.querySelector('#say .kicker').textContent = 'The one line to remember';
window.Z1 = () => go(Z, 9);
</script>
</body>
