<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Stateless API: lecture</title>
<link rel="stylesheet" href="../lib/lecture.css">
<script src="../lib/icons.js"></script>
<script src="../lib/lecture.js"></script>
</head>
<body>
<script>
Title({ num: 3, name: 'Stateless API', sub: 'One service, run as identical copies', phase: 'Version 1', pills: ['Every design', 'Scale by adding copies'] });

// ---- definition: copies forget the user; state lives in the database
const D = Define('def', {
  html: 'Your backend program, run as <b>several identical copies</b> that <b>forget the user</b> between requests. Carts and logins live <b>in the database</b>, so <b>any copy</b> can serve any request.',
  extra: { label: 'One program; the cloud runs the copies:', pills: ['Cloud Run', 'AWS ECS', 'Azure Container Apps'] },
});
const dd = D.d;
dd.node('u', 130, 540, 'users', 'Users', '', { w: 150 });
['1', '2', '3'].forEach((n, i) => dd.node('c' + n, 470, 290 + i * 250, 'server', 'Copy ' + n, '', { w: 160, hidden: true }));
dd.node('db', 810, 540, 'db', 'Database', 'carts, logins', { w: 190, hidden: true });
['c1', 'c2', 'c3'].forEach(k => { dd.link('u', k); dd.link(k, 'db'); });
let defLoop = null;
window.SD = async () => {
  D.show();
  dd.popAll(['c1', 'c2', 'c3', 'db'], 300);
  await sleep(1500);
  const ks = ['c1', 'c3', 'c2'];
  let i = 0;
  const tick = async () => {
    const k = ks[i++ % 3];
    await dd.send('u', k, { dur: 500 });
    await dd.send(k, 'db', { dur: 450, color: 'muted', r: 8 });
    dd.send('db', k, { dur: 450, color: 'good', r: 8 });
  };
  tick(); defLoop = setInterval(tick, 1500);
};
window.SD2 = () => D.more();

// ---- the problem: cart kept in one copy's memory
const P = Stage('prob', { caption: ['The problem', 'Copy 1 keeps your cart in its own memory'] });
P.node('u', 220, 560, 'user', 'You', '', { w: 150 });
P.node('lb', 640, 560, 'split', 'Load balancer', '', { w: 220 });
P.node('c1', 1240, 360, 'server', 'Copy 1', 'cart in memory', { w: 220 });
P.node('c2', 1240, 780, 'server', 'Copy 2', '', { w: 220 });
P.link('u', 'lb'); P.link('lb', 'c1'); P.link('lb', 'c2');
window.S1 = async () => {
  clearInterval(defLoop); P.show();
  await sleep(500);
  await P.flow(['u', 'lb', 'c1'], { dur: 650, label: 'add pizza' });
  P.badge('c1', 'cart: 2 pizzas', 'acc');
};
window.S1b = async () => {
  P.cap('Next click, different copy', 'Copy 2 has never seen this cart');
  await P.flow(['u', 'lb', 'c2'], { dur: 650, label: 'checkout' });
  P.badge('c2', 'cart: empty', 'bad');
  P.tag('u', 'where is my cart?', 'bad');
};
window.S1c = async () => {
  P.cap('Copy 1 crashes', 'The cart was only in its memory, so it is gone');
  P.tone('c1', 'bad'); P.rename('c1', 'Copy 1', 'crashed'); P.unbadge('c1');
  for (let i = 0; i < 3; i++) { P.tag('c1', 'cart lost', 'bad'); await sleep(1100); }
};

// ---- how it works: save state, read it back, session token
const M = Stage('how', { caption: ['Keep nothing between requests', 'Copy 1 saves the cart, then forgets it'] });
M.node('u', 170, 575, 'user', 'You', '', { w: 150 });
M.node('lb', 470, 575, 'split', 'Load balancer', '', { w: 210 });
['1', '2', '3', '4'].forEach((n, i) => M.node('c' + n, 850, 320 + i * 170, 'server', 'Copy ' + n, '', { w: 170, hidden: true }));
M.node('db', 1480, 575, 'db', 'Database', 'carts, orders, logins', { w: 280 });
M.link('u', 'lb'); ['c1', 'c2', 'c3'].forEach(k => { M.link('lb', k); M.link(k, 'db'); });
let rrM = null;
window.S2 = async () => {
  M.show(); M.popAll(['c1', 'c2', 'c3'], 250);
  await sleep(1200);
  await M.flow(['u', 'lb', 'c1'], { dur: 600, label: 'add pizza' });
  await M.send('c1', 'db', { dur: 800, color: 'good', label: 'save cart' });
  M.badge('db', 'cart saved', 'good');
};
window.S2b = async () => {
  M.cap('Any copy can read it back', 'The next click lands on copy 3');
  await M.flow(['u', 'lb', 'c3'], { dur: 600, label: 'checkout' });
  await M.send('c3', 'db', { dur: 700, color: 'muted', r: 8, label: 'read cart' });
  await M.send('db', 'c3', { dur: 700, color: 'good', label: 'cart' });
  M.badge('c3', 'cart: 2 pizzas', 'good', 'bottom');
};
window.S2c = async () => {
  M.cap('How it knows it\'s you', 'A session token: a hard-to-guess ID in a cookie');
  M.unbadge('db'); M.unbadge('c3');
  await M.send('u', 'lb', { dur: 600, color: 'warn', label: 'token 7f3a' });
  await M.send('lb', 'c2', { dur: 600, color: 'warn', label: 'token 7f3a' });
  await M.send('c2', 'db', { dur: 700, color: 'muted', r: 8, label: 'whose token?' });
  await M.send('db', 'c2', { dur: 700, color: 'good', label: 'user 812' });
  M.badge('db', 'logins live here', 'acc');
};
window.S3 = async () => {
  M.cap('Copies are interchangeable', 'More copies, more capacity');
  M.unbadge('db'); M.link('lb', 'c4'); M.link('c4', 'db'); M.pop('c4'); M.tag('c4', 'new copy', 'good', -100);
  const ks = ['c1', 'c2', 'c3', 'c4']; let i = 0;
  rrM = setInterval(async () => { const k = ks[i++ % 4]; await M.send('u', 'lb', { dur: 350 }); await M.send('lb', k, { dur: 400, color: 'good' }); M.send(k, 'db', { dur: 450, color: 'muted', r: 8 }); }, 420);
};

// ---- what it's for
const U = Cards('uses', {
  head: 'What stateless buys you', items: [
    { icon: 'scaleup', title: 'Scale out', text: 'Add copies when traffic grows. They help at once.' },
    { icon: 'shield', color: 'good', title: 'Survive crashes', text: 'A copy dies, and no user loses anything.' },
    { icon: 'retry', title: 'Easy deploys', text: 'Replace copies one at a time.' },
  ],
});
window.S4 = () => { clearInterval(rrM); U.show(); setTimeout(() => U.reveal(0), 300); };
window.S4b = () => U.reveal(1);
window.S4c = () => U.reveal(2);

// ---- scenario: pizza shop, 2 copies become 8 before kickoff
const S = Stage('scen', { caption: ['', ''] });
const r1 = 380, r2 = 770;
S.text(960, 250, 'Carts in memory', { color: 'bad', size: 44 });
S.text(960, 640, 'Carts in the database', { color: 'good', size: 44 });
S.node('u1', 130, r1, 'users', 'Fans', '', { w: 140 });
S.node('u2', 130, r2, 'users', 'Fans', '', { w: 140 });
for (let i = 1; i <= 8; i++) {
  S.node('a' + i, 290 + i * 190, r1, 'server', 'Copy ' + i, '', { w: 160, hidden: i > 2 });
  S.node('b' + i, 290 + i * 190, r2, 'server', 'Copy ' + i, '', { w: 160, hidden: i > 2 });
}
const st1 = S.text(960, r1 + 115, '2 of 8 copies working', { color: 'bad', size: 34 });
const st2 = S.text(960, r2 + 115, '8 of 8 copies working', { color: 'good', size: 34 });
st1.setAttribute('opacity', 0); st2.setAttribute('opacity', 0);
S.text(960, 1010, 'Pizza shop, one hour before kickoff: 2 copies become 8', { color: 'muted', size: 34, weight: 600 });
let s1, s2;
const newA = [3, 4, 5, 6, 7, 8].map(i => 'a' + i), newB = [3, 4, 5, 6, 7, 8].map(i => 'b' + i);
window.S5 = () => {
  S.show();
  setTimeout(() => { S.popAll(newA, 200); S.popAll(newB, 200); }, 900);
  newA.concat(newB).forEach(k => setTimeout(() => S.tone(k, 'good'), 2400));
};
window.S5b = () => {
  newA.forEach(k => S.tone(k, 'muted'));
  s1 = S.stream('u1', ['a1', 'a2'], { every: 160, dur: 700, color: 'bad' });
  setTimeout(() => { S.tone('a1', 'bad'); S.tone('a2', 'bad'); S.tag('a1', 'overloaded', 'bad'); S.tag('a2', 'overloaded', 'bad'); }, 1500);
  setTimeout(() => { st1.setAttribute('opacity', 1); S.tag('a5', 'idle', 'muted'); }, 2200);
};
window.S5c = () => {
  ['b1', 'b2'].concat(newB).forEach(k => S.tone(k, 'good'));
  s2 = S.stream('u2', ['b1', 'b2', 'b3', 'b4', 'b5', 'b6', 'b7', 'b8'], { every: 160, dur: 800, color: 'good' });
  setTimeout(() => st2.setAttribute('opacity', 1), 1800);
};

// ---- where it fits
const Y = System('sys', { highlight: ['api', 'db', 'cache'] });
window.S6 = async () => {
  s1 && s1(); s2 && s2(); Y.show(); await sleep(600);
  for (let i = 0; i < 3; i++) { Y.flow(['browser', 'cdn', 'lb', 'api', 'db'], { dur: 450 }); await sleep(900); }
};
window.S6b = () => { Y.cap('The part you multiply', 'What must be remembered lives in the database and cache'); Y.badge('api', 'disposable', 'good', 'bottom'); Y.badge('db', 'the state', 'acc', 'bottom'); };

// ---- trade-offs
const T = Cards('trade', {
  head: 'Two things to know', cols: 2, items: [
    { icon: 'db', color: 'warn', title: 'Load moves to the database', text: 'Every request reads state there, so it has to keep up.' },
    { icon: 'box', title: 'One service, not many', text: 'Microservices solve big-company problems, not small-team ones.' },
  ],
});
window.S7 = () => { T.show(); setTimeout(() => T.reveal(0), 300); };
window.S7b = () => T.reveal(1);

const Z = Say('say', 'One service, run as several identical copies. Stateless, so I scale by adding copies.');
window.S8 = () => Z.show();
</script>
</body>
</html>
